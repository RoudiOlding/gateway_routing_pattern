apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-v1
  labels:
    app: product-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
      version: v1
  template:
    metadata:
      labels:
        app: product-service
        version: v1
    spec:
      containers:
      - name: product-service
        image: product-service:latest
        ports:
        - containerPort: 3000
        env:
        - name: VERSION
          value: "v1"
        - name: PORT
          value: "3000"
        imagePullPolicy: Never

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-v2
  labels:
    app: product-service
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
      version: v2
  template:
    metadata:
      labels:
        app: product-service
        version: v2
    spec:
      containers:
      - name: product-service
        image: product-service:latest
        ports:
        - containerPort: 3000
        env:
        - name: VERSION
          value: "v2"
        - name: PORT
          value: "3000"
        imagePullPolicy: Never

---
apiVersion: v1
kind: Service
metadata:
  name: product-service-v1
spec:
  selector:
    app: product-service
    version: v1
  ports:
  - port: 80
    targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: product-service-v2
spec:
  selector:
    app: product-service
    version: v2
  ports:
  - port: 80
    targetPort: 3000